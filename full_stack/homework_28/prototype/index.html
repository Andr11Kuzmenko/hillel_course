<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider — Prototype version</title>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
    <main class="page">
        <p class="page__back"><a href="../index.html">&larr; Back</a></p>
        <h1 class="page__title">Slider (prototype version)</h1>

        <div class="slider" id="slider" tabindex="0" aria-roledescription="carousel" aria-label="Image gallery">
            <div class="slider__viewport">
                <ul class="slider__track">
                    <li class="slider__slide">
                        <img class="slider__image" src="../images/1.jpg" alt="Slide 1" draggable="false">
                    </li>
                    <li class="slider__slide">
                        <img class="slider__image" src="../images/2.jpg" alt="Slide 2" draggable="false">
                    </li>
                    <li class="slider__slide">
                        <img class="slider__image" src="../images/3.jpg" alt="Slide 3" draggable="false">
                    </li>
                    <li class="slider__slide">
                        <img class="slider__image" src="../images/4.png" alt="Slide 4" draggable="false">
                    </li>
                    <li class="slider__slide">
                        <img class="slider__image" src="../images/5.jpeg" alt="Slide 5" draggable="false">
                    </li>
                    <li class="slider__slide">
                        <img class="slider__image" src="../images/6.jpg" alt="Slide 6" draggable="false">
                    </li>
                </ul>
            </div>
        </div>

        <p class="page__hint">
            Arrows &larr; &rarr; to navigate &bull; swipe or drag with mouse &bull; button to pause
        </p>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
